<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>YouTube 視聴済み管理 - 設定</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1>自動視聴済み判定の設定</h1>
  <p class="description">
    動画の「再生割合」または「再生時間」のどちらかがしきい値に先に到達した時点で、
    自動的に「視聴済み」になります。
  </p>

  <form id="settings-form">
    <div class="field">
      <label for="thresholdPercent">再生割合のしきい値(%)</label>
      <input type="number" id="thresholdPercent" min="1" max="100" step="1" required />
    </div>

    <div class="field">
      <label for="thresholdMinutes">再生時間のしきい値(分)</label>
      <input type="number" id="thresholdMinutes" min="1" max="999" step="1" required />
    </div>

    <div class="actions">
      <button type="submit">保存</button>
      <span id="save-status" class="save-status"></span>
    </div>
  </form>

  <hr />

  <h1>視聴状態のエクスポート・インポート</h1>
  <p class="description">
    視聴済み/未視聴のデータをJSONファイルとして書き出し、別のPC・別のChromeプロファイルに取り込めます。
  </p>

  <div class="actions">
    <button type="button" id="export-btn">エクスポート</button>
    <button type="button" id="import-btn">インポート</button>
    <input type="file" id="import-file-input" accept="application/json" hidden />
  </div>
  <p id="import-status" class="save-status"></p>

  <script src="../shared/constants.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
